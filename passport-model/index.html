<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><title>Patty Passport · Console organizer</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:clamp(18px,4vw,38px)}.eyebrow{color:#a7d0b4;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.1;margin:.35em 0}p{color:#b9cdc1}#view{height:min(65vh,650px);min-height:340px;border:1px solid #333;border-radius:18px;overflow:hidden;touch-action:none;background:#000}canvas{display:block}#status{min-height:1.5em;font-size:.9rem}a{color:#ace6ba}.detail{font-size:.9rem}button{font:inherit;color:#fff;background:#1b1b1b;border:1px solid #666;border-radius:9px;padding:9px 14px;cursor:pointer}@media(max-width:600px){#view{height:57vh;min-height:300px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body><main><div id="view" aria-label="Interactive 3D model of the console organizer"></div><p id="status" role="status">Loading the 3D model…</p><button id="reset" type="button">Reset view</button></main><!-- Lower rail geometry adapted from REMLURELMI’s console tray remix, based on dMosher’s design, CC BY-SA 4.0: https://www.printables.com/model/1147323-remix-larger-console-tray-for-honda-passportpilotr --><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import {STLLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/STLLoader.js';
const host=document.querySelector('#view'),status=document.querySelector('#status');
try {
 const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000);
 const camera=new THREE.PerspectiveCamera(35,1,.1,2000); camera.position.set(260,-310,240); camera.up.set(0,0,1);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(0,-150,300);scene.add(light);
 const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,0,-10);controls.enableDamping=true;controls.saveState();
 new STLLoader().load('./model.stl',g=>{g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.65,metalness:.08})));status.textContent='';},undefined,()=>{status.textContent='The model could not be loaded. Please refresh the page.'});
 document.querySelector('#reset').addEventListener('click',()=>controls.reset());
 function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()} window.addEventListener('resize',resize);resize();
 renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
} catch(e) {status.textContent='The 3D viewer could not start on this device.';}
</script></body></html>
